
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TogetherPlan - Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background-color: #ddd;
            border-right: 2px solid #999;
            padding: 25px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            color: black;
            text-decoration: none;
            border: 1px solid #999;
            background-color: white;
        }

        .content {
            flex: 1;
            padding: 40px;
        }

        .box {
            background-color: white;
            border: 2px solid #999;
            padding: 25px;
            margin-top: 25px;
            max-width: 800px;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .day {
            border: 1px solid #999;
            background-color: #f8f8f8;
            min-height: 65px;
            padding: 8px;
        }

        .header {
            background-color: #ddd;
            min-height: auto;
            text-align: center;
            font-weight: bold;
        }

        .event {
            background-color: #ddd;
            border: 1px solid #aaa;
            padding: 4px;
            margin-top: 6px;
            font-size: 12px;
        }
    </style>
</head>
